name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
      - name: Validate JSON
        run: |
          find . -name '*.json' -not -path '*/node_modules/*' -exec sh -c '
            for f do
              if ! jq empty "$f" 2>/dev/null; then
                echo "Invalid JSON: $f"
                exit 1
              fi
            done
          ' sh {} +

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: productos/PRODUCTO_07_CLI_AI_Commit_Tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: productos/PRODUCTO_07_CLI_AI_Commit_Tool/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('productos/PRODUCTO_07_CLI_AI_Commit_Tool/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build
        run: npx tsc
