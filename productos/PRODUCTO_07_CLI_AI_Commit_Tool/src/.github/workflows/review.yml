name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AI code review
        run: npx aicommit@latest review > review-output.md
        env:
          AICOMMIT_API_KEY: ${{ secrets.AICOMMIT_API_KEY }}
          AICOMMIT_PROVIDER: ${{ secrets.AICOMMIT_PROVIDER || 'openai' }}
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-output.md', 'utf-8');
            if (!body.trim()) {
              console.log('No review output to post.');
              return;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
